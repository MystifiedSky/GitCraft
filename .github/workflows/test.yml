name: Tests

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each push to main gets its own result, even if another merge lands first.
  group: gitcraft-tests-${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: Windows
          - runner: ubuntu-22.04
            platform: Linux
          - runner: macos-latest
            platform: macOS
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libdbus-1-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tests-${{ matrix.runner }}
      - name: Test release notes
        run: node --test scripts/changelog-release.test.mjs
      - name: Test PR disclosure validation
        run: node --test scripts/pr-ai-disclosure.test.mjs
      - name: Check Rust lints
        if: runner.os == 'Linux'
        run: cargo clippy --locked --workspace --all-targets -- -D clippy::correctness
      - name: Audit Cargo dependencies
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Report the Git version
        run: git --version
      - name: Test Git operations and the interface
        env:
          RUST_BACKTRACE: short
        run: cargo test --locked --workspace -- --test-threads=1

  native-ui:
    # Keep the required check's name while the branch rule still uses it.
    name: Headless browser regressions
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: native-headless-ui
      - name: Test native controls without opening a window
        run: cargo test --locked -p gitcraft headless_ -- --test-threads=1
