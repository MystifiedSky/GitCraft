name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitcraft-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: Windows
          - runner: ubuntu-22.04
            platform: Linux
          - runner: macos-latest
            platform: macOS
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tests-${{ matrix.runner }}
      - name: Install frontend dependencies
        run: npm --prefix ui ci --ignore-scripts
      - name: Build and typecheck the frontend
        run: npm --prefix ui run build
      - name: Test the frontend
        run: npm --prefix ui test
      - name: Test release notes
        run: node --test scripts/changelog-release.test.mjs
      - name: Test native Git operations
        run: cargo test --locked -- --test-threads=1
