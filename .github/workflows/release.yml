name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep publication ordered and let pushes wait for their turn.
concurrency:
  group: gitcraft-release
  queue: max

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assign the build version
        id: version
        shell: bash
        run: |
          number=$(node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('tauri.conf.json', 'utf8'));
          const base = /^(\d+)\.(\d+)\.(\d+)$/.exec(config.version);
          if (!base || !config.plugins.updater.pubkey) {
            throw new Error('Set a stable base version and the updater public key in tauri.conf.json.');
          }
          const patch = Number(base[3]) + Number(process.env.GITHUB_RUN_NUMBER);
          if (!Number.isInteger(patch) || patch > 65535 || Number(base[1]) > 255 || Number(base[2]) > 255) {
            throw new Error('Release version exceeds Windows MSI version limits.');
          }
          console.log(`${base[1]}.${base[2]}.${patch}`);
          NODE
          )
          echo "number=$number" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - runner: macos-latest
            platform: macos
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - runner: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux build packages
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Third-party actions are pinned to a full commit hash, so a moved tag or branch can't change what runs in the
      # release build. To update: look up the new commit (for example `gh api repos/dtolnay/rust-toolchain/commits/stable`)
      # and change the hash and the comment together.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Stamp and build the front end
        env:
          VERSION: ${{ needs.version.outputs.number }}
        shell: bash
        run: |
          node ui/scripts/set-version.mjs "$VERSION"
          # --ignore-scripts: dependencies' install scripts don't run in the release build. The build doesn't need
          # them (esbuild ships its own program; fsevents is only a macOS dev-server extra).
          npm --prefix ui ci --ignore-scripts
          npm --prefix ui run build

      - name: Build installers and sign updates
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY. See RELEASING.md."
            exit 1
          fi
          node ui/node_modules/@tauri-apps/cli/tauri.js build --ci \
            --config tauri.release.conf.json --target "$TARGET" --bundles "$BUNDLES" -- --locked

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            target/${{ matrix.target }}/release/bundle/*/*-setup.exe
            target/${{ matrix.target }}/release/bundle/*/*.msi
            target/${{ matrix.target }}/release/bundle/*/*.dmg
            target/${{ matrix.target }}/release/bundle/*/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/*/*.AppImage
            target/${{ matrix.target }}/release/bundle/*/*.deb
            target/${{ matrix.target }}/release/bundle/*/*.rpm
            target/${{ matrix.target }}/release/bundle/*/*.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: bundles
      - name: Prepare installers and the update manifest
        env:
          VERSION: ${{ needs.version.outputs.number }}
        run: node scripts/release-assets.mjs "$VERSION" "$GITHUB_REPOSITORY"
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.number }}
        shell: bash
        run: |
          tag="v$VERSION"
          if release=$(gh release view "$tag" --json isDraft,targetCommitish 2>/dev/null); then
            if [[ $(jq -r .targetCommitish <<<"$release") != "$GITHUB_SHA" ]]; then
              echo "::error::Release $tag already belongs to a different commit."
              exit 1
            fi
            if [[ $(jq -r .isDraft <<<"$release") != true ]]; then
              echo "Release $tag is already published."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "GitCraft $tag" --generate-notes
          fi
          gh release upload "$tag" release-assets/* --clobber

          # An older run retried after a newer release must never move the update feed back.
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          newest=$(printf '%s\n' "$published" "$tag" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          latest=false
          if [[ "$newest" == "$tag" ]]; then latest=true; fi
          gh release edit "$tag" --draft=false --latest="$latest"
